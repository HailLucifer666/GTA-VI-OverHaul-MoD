<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="220" viewBox="0 0 1200 220" role="img" aria-label="Classic GTA Overhaul — Animated Gameplay Showcase">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0E071D"/>
      <stop offset="0.5" stop-color="#190B2E"/>
      <stop offset="1" stop-color="#0E071D"/>
    </linearGradient>
    <linearGradient id="cardStroke" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FF3FA4"/>
      <stop offset="0.5" stop-color="#FF8A3D"/>
      <stop offset="1" stop-color="#2DD4BF"/>
    </linearGradient>
    <linearGradient id="scan" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2DD4BF" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#FF3FA4" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#2DD4BF" stop-opacity="0"/>
    </linearGradient>
    <style>
      .card { animation: floatCard 3.6s ease-in-out infinite; }
      @keyframes floatCard { 0%, 100% { transform: translateY(0px); } 50% { transform: translateY(-5px); } }
      .led { animation: pulseLed 1.8s ease-in-out infinite; }
      @keyframes pulseLed { 0%, 100% { opacity: 0.45; } 50% { opacity: 1; } }
      .beam { animation: beamMove 4.2s linear infinite; }
      @keyframes beamMove { 0% { transform: translateX(-260px); } 100% { transform: translateX(1320px); } }
    </style>
  </defs>

  <rect width="1200" height="220" rx="14" fill="url(#bg)" stroke="#2E1A4A" stroke-width="1.5"/>
  <rect class="beam" x="0" y="0" width="220" height="220" fill="url(#scan)"/>

  <text x="600" y="34" text-anchor="middle" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13" font-weight="700" letter-spacing="3.5" fill="#FF8AC6">PLAYABLE TODAY IN THE F7 HUB — BUILT FOR GTA VI PC DAY 1</text>

  <!-- Card 1 -->
  <g class="card" style="animation-delay:0s">
    <rect x="26" y="54" width="214" height="142" rx="10" fill="#150A28" stroke="url(#cardStroke)" stroke-width="1.4"/>
    <circle class="led" cx="46" cy="74" r="4" fill="#2DD4BF"/>
    <text x="58" y="78" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" font-weight="700" fill="#2DD4BF">ARCADE RESTORATION</text>
    <text x="42" y="110" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="17" font-weight="800" fill="#FFF6EA">Instant Car Theft</text>
    <text x="42" y="134" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#C9B8DF">Zero lockpick QTEs.</text>
    <text x="42" y="152" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#C9B8DF">Instant unlock, kill alarm,</text>
    <text x="42" y="170" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#C9B8DF">pacify driver &amp; drive off.</text>
  </g>

  <!-- Card 2 -->
  <g class="card" style="animation-delay:0.4s">
    <rect x="259" y="54" width="214" height="142" rx="10" fill="#150A28" stroke="url(#cardStroke)" stroke-width="1.4"/>
    <circle class="led" cx="279" cy="74" r="4" fill="#FF8A3D" style="animation-delay:0.3s"/>
    <text x="291" y="78" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" font-weight="700" fill="#FF8A3D">CLASSIC HEAT</text>
    <text x="275" y="110" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="17" font-weight="800" fill="#FFF6EA">Wanted &amp; Bribes</text>
    <text x="275" y="134" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#C9B8DF">20s out-of-sight cooldown</text>
    <text x="275" y="152" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#C9B8DF">+ $500 Pay 'n' Spray bribe</text>
    <text x="275" y="170" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#C9B8DF">clears stars &amp; Profile Heat.</text>
  </g>

  <!-- Card 3 -->
  <g class="card" style="animation-delay:0.8s">
    <rect x="492" y="54" width="214" height="142" rx="10" fill="#150A28" stroke="url(#cardStroke)" stroke-width="1.4"/>
    <circle class="led" cx="512" cy="74" r="4" fill="#FF3FA4" style="animation-delay:0.6s"/>
    <text x="524" y="78" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" font-weight="700" fill="#FF3FA4">SAN ANDREAS STYLE</text>
    <text x="508" y="110" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="17" font-weight="800" fill="#FFF6EA">Gang Turf Wars</text>
    <text x="508" y="134" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#C9B8DF">4 districts · 3 hostile waves.</text>
    <text x="508" y="152" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#C9B8DF">$5,000 capture bonus +</text>
    <text x="508" y="170" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#C9B8DF">$2,500/day passive income.</text>
  </g>

  <!-- Card 4 -->
  <g class="card" style="animation-delay:1.2s">
    <rect x="725" y="54" width="214" height="142" rx="10" fill="#150A28" stroke="url(#cardStroke)" stroke-width="1.4"/>
    <circle class="led" cx="745" cy="74" r="4" fill="#2DD4BF" style="animation-delay:0.9s"/>
    <text x="757" y="78" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" font-weight="700" fill="#2DD4BF">PURE CHAOS</text>
    <text x="741" y="110" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="17" font-weight="800" fill="#FFF6EA">Classic Cheats</text>
    <text x="741" y="134" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#C9B8DF">Super Jump, Never Wanted,</text>
    <text x="741" y="152" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#C9B8DF">No Refuel/Chores, Classic</text>
    <text x="741" y="170" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#C9B8DF">Cars, Weather &amp; Clock.</text>
  </g>

  <!-- Card 5 -->
  <g class="card" style="animation-delay:1.6s">
    <rect x="958" y="54" width="214" height="142" rx="10" fill="#150A28" stroke="url(#cardStroke)" stroke-width="1.4"/>
    <circle class="led" cx="978" cy="74" r="4" fill="#FF8A3D" style="animation-delay:1.2s"/>
    <text x="990" y="78" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" font-weight="700" fill="#FF8A3D">FULL SANDBOX</text>
    <text x="974" y="110" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="17" font-weight="800" fill="#FFF6EA">Jobs, Casino &amp; Dogs</text>
    <text x="974" y="134" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#C9B8DF">Taxi Shifts, 911 Dispatch,</text>
    <text x="974" y="152" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#C9B8DF">LCN Stocks, 21 Blackjack,</text>
    <text x="974" y="170" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#C9B8DF">Kraken &amp; Guard Dogs.</text>
  </g>
</svg>
