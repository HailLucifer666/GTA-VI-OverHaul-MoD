<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="400" viewBox="0 0 1000 400" role="img" aria-labelledby="atitle adesc">
  <title id="atitle">Architecture: contracts, core, infrastructure and a swappable game adapter</title>
  <desc id="adesc">Four layers with animated data flow. Game logic lives in Core and never references GTA APIs; the adapter is the only layer that talks to the game.</desc>

  <defs>
    <linearGradient id="abg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0C0716"/>
      <stop offset="1" stop-color="#150A24"/>
    </linearGradient>
    <filter id="aglow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <marker id="arrowPink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#FF3FA4"/>
    </marker>
    <marker id="arrowCyan" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#22D3EE"/>
    </marker>
    <marker id="arrowOrange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#FF8A3D"/>
    </marker>
  </defs>

  <rect width="1000" height="400" fill="url(#abg)"/>

  <text x="40" y="52" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="15" letter-spacing="5" fill="#FF8A3D">ENGINE-AGNOSTIC BY DESIGN</text>
  <text x="960" y="52" text-anchor="end" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13" letter-spacing="2" fill="#8B7FA8">v0.6.3</text>

  <!-- Boxes -->
  <g font-family="Segoe UI, Arial, Helvetica, sans-serif">
    <rect x="30" y="110" width="190" height="120" rx="12" fill="#120A1E" stroke="#22D3EE" stroke-width="2"/>
    <text x="125" y="152" text-anchor="middle" font-size="17" font-weight="700" fill="#FFFFFF">CONTRACTS</text>
    <text x="125" y="180" text-anchor="middle" font-size="12" fill="#B9AECB">interfaces + DTOs</text>
    <text x="125" y="202" text-anchor="middle" font-size="11" fill="#22D3EE">no game dependency</text>

    <rect x="260" y="110" width="190" height="120" rx="12" fill="#120A1E" stroke="#FF3FA4" stroke-width="2"/>
    <text x="355" y="152" text-anchor="middle" font-size="17" font-weight="700" fill="#FFFFFF">CORE</text>
    <text x="355" y="180" text-anchor="middle" font-size="12" fill="#B9AECB">gameplay engines</text>
    <text x="355" y="202" text-anchor="middle" font-size="11" fill="#FF7FBF">state machines + rules</text>

    <rect x="490" y="110" width="190" height="120" rx="12" fill="#120A1E" stroke="#FF8A3D" stroke-width="2"/>
    <text x="585" y="152" text-anchor="middle" font-size="17" font-weight="700" fill="#FFFFFF">INFRASTRUCTURE</text>
    <text x="585" y="180" text-anchor="middle" font-size="12" fill="#B9AECB">scheduler · registry</text>
    <text x="585" y="202" text-anchor="middle" font-size="11" fill="#FFB37A">atomic persistence</text>

    <rect x="720" y="110" width="250" height="120" rx="12" fill="#120A1E" stroke="#22D3EE" stroke-width="2" stroke-dasharray="10 6"/>
    <text x="845" y="152" text-anchor="middle" font-size="17" font-weight="700" fill="#FFFFFF">ADAPTER</text>
    <text x="845" y="180" text-anchor="middle" font-size="12" fill="#B9AECB">GTA V today</text>
    <text x="845" y="202" text-anchor="middle" font-size="11" fill="#22D3EE">GTA VI when it opens</text>
  </g>

  <!-- Animated flows -->
  <g fill="none" stroke-width="2" stroke-dasharray="7 7">
    <path d="M220 170 H260" stroke="#FF3FA4" marker-end="url(#arrowPink)">
      <animate attributeName="stroke-dashoffset" values="0;-28" dur="1.1s" repeatCount="indefinite"/>
    </path>
    <path d="M450 170 H490" stroke="#FF8A3D" marker-end="url(#arrowOrange)">
      <animate attributeName="stroke-dashoffset" values="0;-28" dur="1.1s" repeatCount="indefinite"/>
    </path>
    <path d="M680 170 H720" stroke="#22D3EE" marker-end="url(#arrowCyan)">
      <animate attributeName="stroke-dashoffset" values="0;-28" dur="1.1s" repeatCount="indefinite"/>
    </path>
  </g>

  <!-- Travelling pulses across each gap -->
  <circle r="3.5" fill="#22D3EE" filter="url(#aglow)">
    <animateMotion dur="2.4s" repeatCount="indefinite" path="M222 170 H258"/>
  </circle>
  <circle r="3.5" fill="#FF8A3D" filter="url(#aglow)">
    <animateMotion dur="2.4s" begin="0.8s" repeatCount="indefinite" path="M452 170 H488"/>
  </circle>
  <circle r="3.5" fill="#FF3FA4" filter="url(#aglow)">
    <animateMotion dur="2.4s" begin="1.6s" repeatCount="indefinite" path="M682 170 H718"/>
  </circle>

  <!-- Legend -->
  <g font-family="Segoe UI, Arial, Helvetica, sans-serif">
    <text x="40" y="290" font-size="14" fill="#FFFFFF">Game logic never references <tspan fill="#FF3FA4" font-family="Consolas, monospace">GTA.*</tspan> or <tspan fill="#FF3FA4" font-family="Consolas, monospace">LemonUI.*</tspan>.</text>
    <text x="40" y="316" font-size="14" fill="#B9AECB">Swap the adapter and the whole mod moves to the next game.</text>
    <text x="40" y="352" font-size="12" fill="#7C6F98">Enforced by the build: Contracts and Core reference only System and System.Core.</text>
  </g>

  <line x1="40" y1="332" x2="960" y2="332" stroke="#2A1B40" stroke-width="1"/>
</svg>
