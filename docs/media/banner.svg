<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="340" viewBox="0 0 1280 340" role="img" aria-labelledby="btitle bdesc">
  <title id="btitle">Classic GTA Overhaul — Animated Vice City Sunset</title>
  <desc id="bdesc">Animated GTA VI-style Vice City sunset with pulsing neon VI, gliding helicopter, blinking skyline beacons, rippling neon water reflections, swaying palms, and light sweep.</desc>

  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#140724"/>
      <stop offset="0.22" stop-color="#3A0F45"/>
      <stop offset="0.45" stop-color="#7A1758"/>
      <stop offset="0.64" stop-color="#C2185B"/>
      <stop offset="0.80" stop-color="#FF6A3D"/>
      <stop offset="0.92" stop-color="#FFA25C"/>
      <stop offset="1" stop-color="#FFD9A8"/>
    </linearGradient>

    <radialGradient id="sunCore" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#FFFBF2"/>
      <stop offset="0.40" stop-color="#FFE7C2"/>
      <stop offset="0.68" stop-color="#FFB36B"/>
      <stop offset="0.88" stop-color="#FF7A3D" stop-opacity="0.6"/>
      <stop offset="1" stop-color="#FF7A3D" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="sunHalo" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#FFD9A8" stop-opacity="0.75"/>
      <stop offset="0.45" stop-color="#FF7A3D" stop-opacity="0.32"/>
      <stop offset="1" stop-color="#FF3E9D" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="viFill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFF0F8"/>
      <stop offset="0.30" stop-color="#FF6CB6"/>
      <stop offset="0.65" stop-color="#FF2E93"/>
      <stop offset="1" stop-color="#9B1158"/>
    </linearGradient>

    <linearGradient id="water" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFC98A"/>
      <stop offset="0.16" stop-color="#E0546F"/>
      <stop offset="0.45" stop-color="#7A1F5E"/>
      <stop offset="0.75" stop-color="#1B3F52"/>
      <stop offset="1" stop-color="#0E071D"/>
    </linearGradient>

    <linearGradient id="sweepGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FF3FA4" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#FFF6EA" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#2DD4BF" stop-opacity="0"/>
    </linearGradient>

    <radialGradient id="scrim" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#160927" stop-opacity="0.48"/>
      <stop offset="0.65" stop-color="#160927" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#160927" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="cloudPink" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#FF8FB4" stop-opacity="0.30"/>
      <stop offset="0.6" stop-color="#FF8FB4" stop-opacity="0.10"/>
      <stop offset="1" stop-color="#FF8FB4" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="cloudGold" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#FFC98A" stop-opacity="0.30"/>
      <stop offset="0.6" stop-color="#FFC98A" stop-opacity="0.10"/>
      <stop offset="1" stop-color="#FFC98A" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="waterGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#FFC98A" stop-opacity="0.46"/>
      <stop offset="0.55" stop-color="#FF6A9E" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#FF6A9E" stop-opacity="0"/>
    </radialGradient>

    <filter id="glow" x="-25%" y="-25%" width="150%" height="150%">
      <feGaussianBlur stdDeviation="4.5" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="textshadow" x="-20%" y="-40%" width="140%" height="200%">
      <feGaussianBlur stdDeviation="5"/>
    </filter>

    <style>
      .sun { animation: bloom 3.2s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
      @keyframes bloom { 0%, 100% { opacity: 0.88; transform: scale(1); } 50% { opacity: 1; transform: scale(1.07); } }

      .cloud-a { animation: driftA 16s ease-in-out infinite alternate; }
      .cloud-b { animation: driftB 20s ease-in-out infinite alternate; }
      @keyframes driftA { from { transform: translateX(-60px); } to { transform: translateX(70px); } }
      @keyframes driftB { from { transform: translateX(65px); } to { transform: translateX(-65px); } }

      .palm-l { animation: swayL 4.2s ease-in-out infinite alternate; transform-box: fill-box; transform-origin: 35% 100%; }
      .palm-r { animation: swayR 4.8s ease-in-out infinite alternate; transform-box: fill-box; transform-origin: 65% 100%; }
      @keyframes swayL { from { transform: rotate(-3.2deg); } to { transform: rotate(2.6deg); } }
      @keyframes swayR { from { transform: rotate(2.8deg); } to { transform: rotate(-3.0deg); } }

      .vi { animation: neon 3.6s ease-in-out infinite; }
      @keyframes neon {
        0%, 76%, 100% { opacity: 0.62; }
        38% { opacity: 0.88; }
        80% { opacity: 0.25; }
        83% { opacity: 0.85; }
        87% { opacity: 0.35; }
        90% { opacity: 0.78; }
      }

      .shimmer { animation: shimmer 2.2s ease-in-out infinite; }
      @keyframes shimmer {
        0%, 100% { opacity: 0.16; transform: translateX(-14px); }
        50% { opacity: 0.82; transform: translateX(14px); }
      }

      .beacon { animation: blink 1.4s steps(2, start) infinite; }
      @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0.12; } }

      .win { animation: twinkle 3.8s ease-in-out infinite; }
      @keyframes twinkle { 0%, 100% { opacity: 0.9; } 50% { opacity: 0.25; } }

      .heli { animation: fly 13s linear infinite; }
      @keyframes fly {
        0% { transform: translate(-120px, 0px); opacity: 0; }
        8% { opacity: 0.95; }
        92% { opacity: 0.95; }
        100% { transform: translate(1420px, -22px); opacity: 0; }
      }

      .sweep { animation: sweep 4.5s ease-in-out infinite; }
      @keyframes sweep {
        0% { transform: translateX(-420px); opacity: 0; }
        20% { opacity: 1; }
        80% { opacity: 1; }
        100% { transform: translateX(1500px); opacity: 0; }
      }

      .mote { opacity: 0; animation: mote 5.8s ease-in-out infinite; }
      @keyframes mote {
        0% { transform: translateY(0px) scale(0.8); opacity: 0; }
        25% { opacity: 0.85; }
        75% { opacity: 0.45; }
        100% { transform: translateY(-78px) scale(1.2); opacity: 0; }
      }

      .neonbar { animation: barpulse 2.4s ease-in-out infinite; }
      @keyframes barpulse { 0%, 100% { opacity: 0.65; } 50% { opacity: 1; } }

      @media (prefers-reduced-motion: reduce) {
        .sun, .cloud-a, .cloud-b, .palm-l, .palm-r, .vi, .shimmer, .beacon, .win, .heli, .sweep, .mote, .neonbar { animation: none !important; }
      }
    </style>

    <g id="palm" fill="none" stroke="#150820" stroke-linecap="round">
      <path d="M0 0 C -11 -48 -12 -100 0 -142" stroke-width="12"/>
      <g stroke-width="8.5">
        <path d="M0 -142 C -32 -168 -70 -174 -104 -158"/>
        <path d="M0 -142 C -22 -178 -56 -194 -92 -196"/>
        <path d="M0 -142 C 2 -180 -16 -208 -42 -222"/>
        <path d="M0 -142 C 28 -170 64 -180 96 -170"/>
        <path d="M0 -142 C 32 -158 70 -154 100 -132"/>
      </g>
      <g stroke-width="7">
        <path d="M0 -142 C -38 -148 -74 -142 -102 -122"/>
        <path d="M0 -142 C 38 -134 74 -124 102 -104"/>
        <path d="M0 -142 C -8 -176 -32 -202 -62 -214"/>
        <path d="M0 -142 C 10 -176 36 -200 68 -210"/>
      </g>
    </g>
  </defs>

  <!-- SKY -->
  <rect x="0" y="0" width="1280" height="240" fill="url(#sky)"/>

  <!-- DRIFTING CLOUDS -->
  <g class="cloud-a">
    <ellipse cx="260" cy="68" rx="280" ry="26" fill="url(#cloudPink)"/>
    <ellipse cx="440" cy="96" rx="210" ry="18" fill="url(#cloudPink)"/>
  </g>
  <g class="cloud-b">
    <ellipse cx="990" cy="60" rx="300" ry="24" fill="url(#cloudGold)"/>
    <ellipse cx="820" cy="90" rx="210" ry="16" fill="url(#cloudGold)"/>
  </g>

  <!-- PULSING VICE CITY SUN -->
  <g class="sun">
    <circle cx="640" cy="196" r="210" fill="url(#sunHalo)"/>
    <circle cx="640" cy="196" r="106" fill="url(#sunCore)"/>
  </g>

  <!-- CRUISING HELICOPTER SILHOUETTE -->
  <g class="heli" fill="#1A0928">
    <rect x="0" y="76" width="26" height="9" rx="4"/>
    <rect x="-18" y="79" width="20" height="3"/>
    <rect x="-20" y="75" width="3" height="8"/>
    <rect x="4" y="71" width="18" height="2"/>
    <rect x="12" y="72" width="2" height="5"/>
    <circle cx="24" cy="81" r="2" fill="#FF3FA4"/>
    <circle cx="-19" cy="76" r="1.6" fill="#2DD4BF"/>
  </g>

  <!-- SCRIM -->
  <ellipse cx="640" cy="150" rx="470" ry="88" fill="url(#scrim)"/>

  <!-- NEON VI WATERMARK -->
  <g class="vi" filter="url(#glow)">
    <text x="640" y="212" text-anchor="middle" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="284" font-weight="800" letter-spacing="8"
          fill="url(#viFill)" fill-opacity="0.14" stroke="#FF6CC2" stroke-width="8" stroke-opacity="0.85">VI</text>
  </g>

  <!-- SKYLINE -->
  <g fill="#150820">
    <rect x="0" y="208" width="54" height="32"/>
    <rect x="50" y="190" width="30" height="50"/>
    <rect x="86" y="214" width="44" height="26"/>
    <rect x="138" y="198" width="24" height="42"/>
    <rect x="172" y="218" width="56" height="22"/>
    <rect x="238" y="202" width="26" height="38"/>
    <rect x="272" y="220" width="46" height="20"/>
    <rect x="330" y="208" width="20" height="32"/>
    <rect x="930" y="210" width="36" height="30"/>
    <rect x="972" y="192" width="26" height="48"/>
    <rect x="1004" y="216" width="48" height="24"/>
    <rect x="1060" y="200" width="26" height="40"/>
    <rect x="1092" y="214" width="42" height="26"/>
    <rect x="1142" y="192" width="24" height="48"/>
    <rect x="1172" y="206" width="52" height="34"/>
    <rect x="1230" y="198" width="50" height="42"/>
    <rect x="64" y="176" width="2" height="14"/>
    <rect x="150" y="182" width="2" height="16"/>
    <rect x="982" y="178" width="2" height="14"/>
    <rect x="1150" y="180" width="2" height="12"/>
  </g>

  <!-- BLINKING RED AVIATION BEACONS -->
  <g fill="#FF3B5C">
    <circle class="beacon" cx="65" cy="175" r="2.6" style="animation-delay:0s"/>
    <circle class="beacon" cx="151" cy="181" r="2.4" style="animation-delay:0.5s"/>
    <circle class="beacon" cx="983" cy="177" r="2.6" style="animation-delay:0.25s"/>
    <circle class="beacon" cx="1151" cy="179" r="2.4" style="animation-delay:0.75s"/>
  </g>

  <!-- TWINKLING SKYLINE WINDOWS -->
  <g fill="#FFC98A">
    <rect class="win" x="58" y="198" width="3" height="5" style="animation-delay:0s"/>
    <rect class="win" x="66" y="212" width="3" height="5" style="animation-delay:1.1s"/>
    <rect class="win" x="146" y="206" width="3" height="5" style="animation-delay:0.6s"/>
    <rect class="win" x="154" y="220" width="3" height="5" style="animation-delay:2.0s"/>
    <rect class="win" x="244" y="210" width="3" height="5" style="animation-delay:1.5s"/>
    <rect class="win" x="980" y="200" width="3" height="5" style="animation-delay:0.3s"/>
    <rect class="win" x="990" y="216" width="3" height="5" style="animation-delay:1.8s"/>
    <rect class="win" x="1068" y="208" width="3" height="5" style="animation-delay:0.9s"/>
    <rect class="win" x="1076" y="222" width="3" height="5" style="animation-delay:2.4s"/>
    <rect class="win" x="1182" y="214" width="3" height="5" style="animation-delay:1.2s"/>
    <rect class="win" x="1240" y="206" width="3" height="5" style="animation-delay:0.4s"/>
  </g>

  <!-- WATER & NEON REFLECTIONS -->
  <rect x="0" y="240" width="1280" height="100" fill="url(#water)"/>
  <ellipse cx="640" cy="292" rx="190" ry="72" fill="url(#waterGlow)"/>
  <g stroke-linecap="round">
    <line class="shimmer" x1="430" y1="258" x2="850" y2="258" stroke="#FFE0B8" stroke-width="2.5" style="animation-delay:0s"/>
    <line class="shimmer" x1="490" y1="276" x2="790" y2="276" stroke="#FF8AC6" stroke-width="2.2" style="animation-delay:0.4s"/>
    <line class="shimmer" x1="395" y1="296" x2="885" y2="296" stroke="#FFE0B8" stroke-width="2.4" style="animation-delay:0.85s"/>
    <line class="shimmer" x1="530" y1="314" x2="750" y2="314" stroke="#2DD4BF" stroke-width="2" style="animation-delay:1.25s"/>
    <line class="shimmer" x1="320" y1="330" x2="960" y2="330" stroke="#FF6CC2" stroke-width="2" style="animation-delay:1.7s"/>
  </g>

  <!-- SWAYING PALMS -->
  <g class="palm-l">
    <use href="#palm" transform="translate(86 348) scale(1.7)"/>
  </g>
  <g class="palm-r">
    <use href="#palm" transform="translate(1196 348) scale(-1.7 1.7)"/>
  </g>

  <!-- TITLE + NEON ACCENT BAR -->
  <text x="640" y="148" text-anchor="middle" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="60" font-weight="800" letter-spacing="2.5" fill="#160927" opacity="0.72" filter="url(#textshadow)">CLASSIC GTA OVERHAUL</text>
  <text x="640" y="145" text-anchor="middle" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="60" font-weight="800" letter-spacing="2.5" fill="#FFF6EA" filter="url(#glow)">CLASSIC GTA OVERHAUL</text>
  <rect class="neonbar" x="390" y="160" width="500" height="3" rx="1.5" fill="#FF3FA4" filter="url(#glow)"/>
  <text x="640" y="190" text-anchor="middle" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="18" font-weight="600" letter-spacing="3.5" fill="#FFE7C2">BUILT BY THE COMMUNITY · THE GTA VI PC SANDBOX WE DESERVED</text>

  <!-- ANIMATED LIGHT SWEEP -->
  <rect class="sweep" x="0" y="0" width="260" height="340" fill="url(#sweepGrad)" transform="skewX(-18)"/>

  <!-- RISING GOLDEN EMBERS -->
  <g fill="#FFE7C2">
    <circle class="mote" cx="180" cy="310" r="2.4" style="animation-delay:0s"/>
    <circle class="mote" cx="310" cy="328" r="1.8" style="animation-delay:1.1s"/>
    <circle class="mote" cx="470" cy="312" r="2.5" style="animation-delay:2.0s"/>
    <circle class="mote" cx="620" cy="332" r="2.0" style="animation-delay:0.6s"/>
    <circle class="mote" cx="760" cy="316" r="2.4" style="animation-delay:2.8s"/>
    <circle class="mote" cx="910" cy="326" r="1.9" style="animation-delay:1.5s"/>
    <circle class="mote" cx="1060" cy="310" r="2.5" style="animation-delay:3.4s"/>
    <circle class="mote" cx="1160" cy="322" r="1.8" style="animation-delay:4.2s"/>
  </g>
</svg>
