<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="168" viewBox="0 0 1200 168" role="img" aria-label="Join the Classic GTA Overhaul Community on Discord">
  <defs>
    <linearGradient id="ctaBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1E0B38"/>
      <stop offset="0.5" stop-color="#4A1154"/>
      <stop offset="1" stop-color="#1A0B30"/>
    </linearGradient>
    <linearGradient id="btnGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FF3FA4"/>
      <stop offset="1" stop-color="#FF8A3D"/>
    </linearGradient>
    <filter id="btnGlow" x="-20%" y="-30%" width="140%" height="160%">
      <feGaussianBlur stdDeviation="5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <style>
      .btnPulse { animation: pulseBtn 2.1s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
      @keyframes pulseBtn { 0%, 100% { transform: scale(1); opacity: 0.94; } 50% { transform: scale(1.04); opacity: 1; } }
      .borderGlow { animation: bGlow 3s ease-in-out infinite; }
      @keyframes bGlow { 0%, 100% { stroke-opacity: 0.55; } 50% { stroke-opacity: 1; } }
    </style>
  </defs>

  <rect class="borderGlow" x="2" y="2" width="1196" height="164" rx="14" fill="url(#ctaBg)" stroke="#FF3FA4" stroke-width="2"/>

  <text x="54" y="56" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13" font-weight="700" letter-spacing="3" fill="#2DD4BF">CALLING ALL MODDERS, DEVS, ARTISTS &amp; GTA FANS</text>
  <text x="54" y="96" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="27" font-weight="800" fill="#FFF6EA">Let's build the GTA VI PC sandbox we wanted — together.</text>
  <text x="54" y="128" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="15" fill="#DFCFEF">Free &amp; open source forever (GPL-3.0) · Story Mode only · Anyone can apply on Discord</text>

  <g class="btnPulse" filter="url(#btnGlow)">
    <rect x="874" y="52" width="278" height="64" rx="12" fill="url(#btnGrad)"/>
    <text x="1013" y="81" text-anchor="middle" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="17" font-weight="800" fill="#FFFFFF">JOIN OUR DISCORD</text>
    <text x="1013" y="102" text-anchor="middle" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" font-weight="600" fill="#FFF3E6">discord.gg/ptHPBCvy →</text>
  </g>
</svg>
