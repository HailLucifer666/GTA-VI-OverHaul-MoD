<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="340" viewBox="0 0 1280 340" role="img" aria-labelledby="btitle bdesc">
  <title id="btitle">Classic GTA Overhaul — a cinematic sunset over Vice City</title>
  <desc id="bdesc">A warm GTA VI-style sunset with a low sun, palm silhouettes, a city skyline, water reflections and a large neon VI behind the words Classic GTA Overhaul.</desc>

  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#160927"/>
      <stop offset="0.20" stop-color="#3A0F45"/>
      <stop offset="0.42" stop-color="#7A1758"/>
      <stop offset="0.60" stop-color="#C2185B"/>
      <stop offset="0.76" stop-color="#FF6A3D"/>
      <stop offset="0.88" stop-color="#FFA25C"/>
      <stop offset="1" stop-color="#FFD9A8"/>
    </linearGradient>

    <radialGradient id="sunCore" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#FFFBF2"/>
      <stop offset="0.38" stop-color="#FFE7C2"/>
      <stop offset="0.66" stop-color="#FFB36B"/>
      <stop offset="0.86" stop-color="#FF7A3D" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#FF7A3D" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="sunHalo" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#FFD9A8" stop-opacity="0.7"/>
      <stop offset="0.42" stop-color="#FF7A3D" stop-opacity="0.30"/>
      <stop offset="1" stop-color="#FF3E9D" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="viFill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFD6EC"/>
      <stop offset="0.30" stop-color="#FF6CB6"/>
      <stop offset="0.62" stop-color="#FF3E9D"/>
      <stop offset="1" stop-color="#C2185B"/>
    </linearGradient>

    <linearGradient id="water" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFC98A"/>
      <stop offset="0.14" stop-color="#E0546F"/>
      <stop offset="0.42" stop-color="#7A1F5E"/>
      <stop offset="0.72" stop-color="#1B3F52"/>
      <stop offset="1" stop-color="#120A24"/>
    </linearGradient>

    <radialGradient id="scrim" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#160927" stop-opacity="0.42"/>
      <stop offset="0.65" stop-color="#160927" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#160927" stop-opacity="0"/>
    </radialGradient>

    <filter id="glow" x="-25%" y="-25%" width="150%" height="150%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="broad" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="14"/>
    </filter>

    <filter id="textshadow" x="-20%" y="-40%" width="140%" height="200%">
      <feGaussianBlur stdDeviation="5"/>
    </filter>

    <filter id="grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="1" stitchTiles="stitch" result="n"/>
      <feColorMatrix in="n" type="saturate" values="0"/>
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.5"/>
      </feComponentTransfer>
    </filter>

    <style>
      .push { animation: push 26s ease-in-out infinite; transform-box: view-box; transform-origin: 640px 170px; }
      @keyframes push { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.03); } }

      .sun { animation: bloom 6.5s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
      @keyframes bloom { 0%, 100% { opacity: 0.9; transform: scale(1); } 50% { opacity: 1; transform: scale(1.03); } }

      .cloud-a { animation: drift 48s ease-in-out infinite alternate; }
      .cloud-b { animation: drift 62s ease-in-out infinite alternate-reverse; }
      @keyframes drift { from { transform: translateX(-34px); } to { transform: translateX(34px); } }

      .palm-l, .palm-r { animation: sway 9s ease-in-out infinite alternate; transform-box: fill-box; transform-origin: 50% 100%; }
      .palm-r { animation-duration: 11s; }
      @keyframes sway { from { transform: rotate(-1.1deg); } to { transform: rotate(1.1deg); } }

      .vi { animation: neon 7.5s ease-in-out infinite; }
      @keyframes neon {
        0%, 88%, 100% { opacity: 0.46; }
        45% { opacity: 0.56; }
        91% { opacity: 0.26; }
        93% { opacity: 0.54; }
        95% { opacity: 0.30; }
      }

      .shimmer { animation: shimmer 3.4s ease-in-out infinite; }
      @keyframes shimmer { 0%, 100% { opacity: 0.14; } 50% { opacity: 0.5; } }

      .mote { animation: mote 14s ease-in-out infinite; }
      @keyframes mote {
        0% { transform: translateY(0); opacity: 0; }
        20% { opacity: 0.55; }
        80% { opacity: 0.35; }
        100% { transform: translateY(-46px); opacity: 0; }
      }

      @media (prefers-reduced-motion: reduce) {
        .push, .sun, .cloud-a, .cloud-b, .palm-l, .palm-r, .vi, .shimmer, .mote { animation: none !important; }
      }
    </style>

    <g id="palm" fill="none" stroke="#150820" stroke-linecap="round">
      <path d="M0 0 C -11 -48 -12 -100 0 -142" stroke-width="12"/>
      <g stroke-width="8.5">
        <path d="M0 -142 C -32 -168 -70 -174 -104 -158"/>
        <path d="M0 -142 C -22 -178 -56 -194 -92 -196"/>
        <path d="M0 -142 C 2 -180 -16 -208 -42 -222"/>
        <path d="M0 -142 C 28 -170 64 -180 96 -170"/>
        <path d="M0 -142 C 32 -158 70 -154 100 -132"/>
      </g>
      <g stroke-width="7">
        <path d="M0 -142 C -38 -148 -74 -142 -102 -122"/>
        <path d="M0 -142 C 38 -134 74 -124 102 -104"/>
        <path d="M0 -142 C -8 -176 -32 -202 -62 -214"/>
        <path d="M0 -142 C 10 -176 36 -200 68 -210"/>
      </g>
    </g>
  </defs>

  <!-- ============ SCENE ============ -->
  <g class="push">
    <rect x="0" y="0" width="1280" height="240" fill="url(#sky)"/>

    <!-- clouds -->
    <g class="cloud-a" fill="#FF8FB4" opacity="0.18" filter="url(#broad)">
      <ellipse cx="250" cy="72" rx="250" ry="16"/>
      <ellipse cx="430" cy="98" rx="180" ry="11"/>
    </g>
    <g class="cloud-b" fill="#FFB27A" opacity="0.20" filter="url(#broad)">
      <ellipse cx="1000" cy="62" rx="270" ry="15"/>
      <ellipse cx="830" cy="90" rx="190" ry="10"/>
    </g>

    <!-- sun, lifted above the skyline -->
    <g class="sun">
      <circle cx="640" cy="196" r="205" fill="url(#sunHalo)"/>
      <circle cx="640" cy="196" r="104" fill="url(#sunCore)"/>
    </g>

    <!-- scrim sits under the neon so it does not dim it -->
    <ellipse cx="640" cy="150" rx="450" ry="86" fill="url(#scrim)"/>

    <!-- neon VI watermark: outline reads through the title -->
    <g class="vi" filter="url(#glow)">
      <text x="640" y="212" text-anchor="middle" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="282" font-weight="800" letter-spacing="8"
            fill="url(#viFill)" fill-opacity="0.10" stroke="#FF7CC0" stroke-width="8" stroke-opacity="0.7">VI</text>
    </g>

    <!-- skyline -->
    <g fill="#150820">
      <rect x="0" y="208" width="54" height="32"/>
      <rect x="50" y="190" width="30" height="50"/>
      <rect x="86" y="214" width="44" height="26"/>
      <rect x="138" y="198" width="24" height="42"/>
      <rect x="172" y="218" width="56" height="22"/>
      <rect x="238" y="202" width="26" height="38"/>
      <rect x="272" y="220" width="46" height="20"/>
      <rect x="330" y="208" width="20" height="32"/>
      <rect x="930" y="210" width="36" height="30"/>
      <rect x="972" y="192" width="26" height="48"/>
      <rect x="1004" y="216" width="48" height="24"/>
      <rect x="1060" y="200" width="26" height="40"/>
      <rect x="1092" y="214" width="42" height="26"/>
      <rect x="1142" y="192" width="24" height="48"/>
      <rect x="1172" y="206" width="52" height="34"/>
      <rect x="1230" y="198" width="50" height="42"/>
      <rect x="64" y="176" width="2" height="14"/>
      <rect x="150" y="182" width="2" height="16"/>
      <rect x="982" y="178" width="2" height="14"/>
      <rect x="1150" y="180" width="2" height="12"/>
    </g>
    <g fill="#FFC98A" opacity="0.8">
      <rect x="58" y="198" width="3" height="5"/>
      <rect x="66" y="212" width="3" height="5"/>
      <rect x="146" y="206" width="3" height="5"/>
      <rect x="154" y="220" width="3" height="5"/>
      <rect x="244" y="210" width="3" height="5"/>
      <rect x="980" y="200" width="3" height="5"/>
      <rect x="990" y="216" width="3" height="5"/>
      <rect x="1068" y="208" width="3" height="5"/>
      <rect x="1076" y="222" width="3" height="5"/>
      <rect x="1182" y="214" width="3" height="5"/>
      <rect x="1240" y="206" width="3" height="5"/>
    </g>

    <!-- water -->
    <rect x="0" y="240" width="1280" height="100" fill="url(#water)"/>
    <ellipse cx="640" cy="292" rx="130" ry="54" fill="#FFB27A" opacity="0.32" filter="url(#broad)"/>
    <g stroke="#FFE0B8" stroke-width="2" stroke-linecap="round">
      <line class="shimmer" x1="452" y1="262" x2="828" y2="262" style="animation-delay:0s"/>
      <line class="shimmer" x1="506" y1="280" x2="774" y2="280" style="animation-delay:0.5s"/>
      <line class="shimmer" x1="412" y1="300" x2="868" y2="300" style="animation-delay:1.1s"/>
      <line class="shimmer" x1="548" y1="318" x2="732" y2="318" style="animation-delay:1.6s"/>
      <line class="shimmer" x1="340" y1="332" x2="940" y2="332" style="animation-delay:2.2s"/>
    </g>

    <!-- palms -->
    <g class="palm-l">
      <use href="#palm" transform="translate(86 348) scale(1.7)"/>
    </g>
    <g class="palm-r">
      <use href="#palm" transform="translate(1196 348) scale(-1.7 1.7)"/>
    </g>
  </g>

  <!-- ============ TITLE ============ -->
  <text x="640" y="153" text-anchor="middle" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="58" font-weight="800" letter-spacing="2" fill="#160927" opacity="0.65" filter="url(#textshadow)">CLASSIC GTA OVERHAUL</text>

  <text x="640" y="150" text-anchor="middle" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="58" font-weight="800" letter-spacing="2" fill="#FFF6EA" filter="url(#glow)">CLASSIC GTA OVERHAUL</text>

  <text x="640" y="190" text-anchor="middle" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="16" letter-spacing="5" fill="#FFE0B8">THE CLASSIC SANDBOX, REBUILT IN THE OPEN</text>

  <!-- dust motes -->
  <g fill="#FFE7C2">
    <circle class="mote" cx="180" cy="300" r="2" style="animation-delay:0s"/>
    <circle class="mote" cx="310" cy="322" r="1.5" style="animation-delay:2.4s"/>
    <circle class="mote" cx="470" cy="306" r="2.2" style="animation-delay:4.1s"/>
    <circle class="mote" cx="700" cy="318" r="1.6" style="animation-delay:1.3s"/>
    <circle class="mote" cx="860" cy="300" r="2" style="animation-delay:5.2s"/>
    <circle class="mote" cx="1010" cy="324" r="1.5" style="animation-delay:3.3s"/>
    <circle class="mote" cx="1140" cy="308" r="2.2" style="animation-delay:6.4s"/>
    <circle class="mote" cx="600" cy="330" r="1.4" style="animation-delay:7.5s"/>
  </g>

  <!-- film grain -->
  <rect width="1280" height="340" filter="url(#grain)" opacity="0.05" pointer-events="none"/>
</svg>
